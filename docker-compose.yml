# Postgres is the only service you need for day-to-day development: run
#   docker compose up -d
# and then `npm run dev` on the host, which is far faster to iterate on than
# rebuilding an image. The full stack (app included) is behind a profile:
#   docker compose --profile app up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackertracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackertracker}
      POSTGRES_DB: ${POSTGRES_DB:-hackertracker}
    ports:
      # Deliberately not 5432. A Homebrew or Postgres.app install already
      # owns that on many machines, and colliding there fails in a genuinely
      # confusing way: the app connects to the *other* Postgres and reports a
      # missing role rather than a missing server.
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackertracker} -d ${POSTGRES_DB:-hackertracker}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    # Compose natively reads .env for substitution above, but not .env.local,
    # and neither reaches the container unless passed in explicitly.
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hackertracker}:${POSTGRES_PASSWORD:-hackertracker}@db:5432/${POSTGRES_DB:-hackertracker}?sslmode=disable
      PORT: "8080"
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-host}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
